<main id="app"></main>

<script>
"use strict";
/* ══════════════════════════════════════════════════════
   컴프야 V26 · 클럽대전 오더 도우미
   ══════════════════════════════════════════════════════ */
const STADIUMS=["고척","잠실","수원","대구","부산","창원","광주","대전","인천"];
const SCHED_N=[5,3,2], SCHED_A=[6,4,2];
const cumOf=s=>{const c=[0];s.forEach(v=>c.push(c[c.length-1]+v));return c;};
const CUM_N=cumOf(SCHED_N), CUM_A=cumOf(SCHED_A);
const ROLE_LABEL={ACE:"에이스",KILLER:"에이스킬러",OPENER:"오프너",NONE:""};
const ROLE_TONE={ACE:"violet",KILLER:"red",OPENER:"amber",NONE:"dim"};
/* ── 랭챌 실력지표 ──
   순위: 판수가 적을수록 실력을 과소평가 → 판수로 보정
   승률: 판수와 무관하지만 표본이 적으면 흔들림 → 50%로 수축 */
const REF_RANK=5000, REF_GAMES=100, WR_PRIOR=10;
function rankZ(rank,games,cfg){
  cfg=cfg||{kGames:0};
  if(!rank||rank<=0)return 0;
  let z=Math.log10(REF_RANK/rank);
  if(games>0&&games<REF_GAMES)z+=cfg.kGames*Math.log10(REF_GAMES/games);
  return z;
}
function winZ(games,wins){
  const p=((wins||0)+WR_PRIOR/2)/((games||0)+WR_PRIOR);
  return Math.log(p/(1-p));
}
const seasonKey=v=>parseFloat(v)||0;
const SEASON_MIN=200, SEASON_MAX=300;
const isoDay=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
/* 랭챌 한 시즌: 월 08:00 → 다음 월 00:00 */
function rcSeason(cfg,now){
  cfg=cfg||{};
  const x=now||new Date();
  const day=(x.getDay()+6)%7;
  const mon=new Date(x); mon.setDate(x.getDate()-day); mon.setHours(8,0,0,0);
  let start,status;
  if(x<mon){ start=new Date(mon); start.setDate(mon.getDate()-7); status="집계 중"; }
  else { start=mon; status="진행 중"; }
  const end=new Date(start.getTime()+7*864e5-8*36e5);
  let num=cfg.anchorSeason||227;
  const anc=new Date((cfg.anchorDate||"2026-08-03")+"T08:00:00");
  if(!isNaN(anc.getTime())) num=(cfg.anchorSeason||227)+Math.round((start-anc)/(7*864e5));
  return {num,status,start,end,label:isoDay(start),endLabel:isoDay(end)};
}

/* ── 저장소: 앱 내장 → 브라우저 → 메모리 순으로 시도 ── */
const mem={};
let storeMode="memory";
try{
  const k="__probe__";
  localStorage.setItem(k,"1"); localStorage.removeItem(k);
  storeMode="browser";
}catch(e){}
if(typeof window!=="undefined"&&window.storage)storeMode="app";
const STORE_LABEL={app:"이 대화에 저장됨",browser:"이 브라우저에 저장됨",
  memory:"저장 안 됨 — 새로고침하면 사라집니다"};
const store={
  async get(k){
    if(storeMode==="app"){try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){}}
    if(storeMode==="browser"){try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(e){}}
    return mem[k]||null;
  },
  async set(k,v){
    mem[k]=v;
    if(storeMode==="app"){try{await window.storage.set(k,v);return true;}catch(e){}}
    if(storeMode==="browser"){try{localStorage.setItem(k,v);return true;}catch(e){}}
    return storeMode==="memory"?false:true;
  }
};
/* 예전 버전 키에서 옮겨오기 */
const LEGACY=["clubwar:v4","clubwar:v3","clubwar:v2","clubwar:v1"];

/* ── 파싱 ── */
const cells=l=>(/[\t,]/.test(l)?l.split(/[\t,]/):l.trim().split(/\s+/)).map(s=>s.trim());
const num=t=>{const n=parseFloat(String(t==null?"":t).replace(/[^\d.\-]/g,""));return isNaN(n)?null:n;};
const isRoleTok=t=>/^(에이스\s*킬러|에킬|킬러|오프너|에이스|ACE|ace)$/.test(t.trim());
const isDeckTok=t=>/^(클라|라인업|상대클라)$/.test(t.trim());
function roleOf(tok){const j=tok.join(" ");
  if(/에이스\s*킬러|에킬|킬러/.test(j))return"KILLER";
  if(/오프너/.test(j))return"OPENER";
  if(/에이스|ACE/i.test(j))return"ACE";return"NONE";}

const isResTok=t=>/^(예비|예비엔트리|대기)$/.test(t.trim());
function parseOurs(text,rc,cfg){
  rc=rc||{}; const out=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim()||/^#/.test(line))return;
    const raw=cells(line); if(!raw.some(x=>x))return;
    const role=roleOf(raw.filter(isRoleTok));
    const reserve=raw.some(isResTok);
    const c=raw.filter(t=>!isRoleTok(t)&&!isResTok(t));
    if(!c[0])return;
    const atk=reserve?0:num(c[2]);
    const pr=rc[c[0]];
    const rank=(pr&&pr.rank)||0, games=pr?pr.games:0, wins=pr?pr.wins:0;
    out.push({id:"A"+i,name:c[0],role,reserve,rank,games,wins,hasRc:!!pr,
      adj:((cfg&&cfg.adj)||{})[c[0]]||0,
      rz:rankZ(rank,games,cfg),wz:winZ(games,wins),
      ovr:num(c[1])!=null?num(c[1]):120,
      atk:reserve?0:((atk!=null&&atk>=0&&atk<=3)?atk:3)});
  });
  return out;
}

/* 닉네임 · 구장(모르면 NA) · 랭챌순위 · 승률(0.XXX) · 판수 · [OVR]
   방어성공/뺏은성공은 오더 탭의 진행 상황(live)에서 가져온다 */
const NA_RE=/^(NA|na|N\/A|n\/a|-|미정|\?)$/;
function parseWr(t){
  if(t==null||t==="")return null;
  const raw=String(t).trim();
  let v=parseFloat(raw.replace(/[^\d.\-]/g,""));
  if(isNaN(v))return null;
  if(/%/.test(raw))return v/100;      /* 64% */
  if(v>1)return v/100;                /* 64 */
  return v;                            /* 0.640 */
}
function parseOpps(text,odb,cfg,live){
  odb=odb||{}; cfg=cfg||{}; live=live||{}; const out=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim()||/^#/.test(line))return;
    const raw=cells(line); if(!raw.some(x=>x))return;
    const ace=raw.some(t=>/^(에이스|ACE|ace)$/.test(t));
    const sub=raw.some(isDeckTok);
    const c=raw.filter(t=>!isRoleTok(t)&&!isDeckTok(t));
    if(!c[0])return;
    const pr=odb[c[0]]||{};

    const stTok=(c[1]||"").trim();
    let stadium=null;
    if(stTok&&!NA_RE.test(stTok)) stadium=STADIUMS.find(sd=>stTok.includes(sd))||null;
    if(!stadium&&!stTok&&pr.stadium) stadium=pr.stadium;

    const rank=num(c[2])||pr.rank||0;
    let wr=parseWr(c[3]); if(wr==null)wr=(pr.wr!=null?pr.wr:null);
    let games=num(c[4])||0, gKnown=games>0;
    if(!gKnown&&pr.gamesKnown&&pr.games>0){games=pr.games;gKnown=true;}
    if(!gKnown)games=cfg.oppGames||40;
    const wins=wr!=null?wr*games:games/2;
    /* OVR은 세 자리 근처의 값만 인정한다. 예전 형식의 0 이 흘러드는 것을 막는다 */
    const ovrRaw=num(c[5]);
    const ovrOk=ovrRaw!=null&&ovrRaw>=50&&ovrRaw<=200;
    const ovr=ovrOk?ovrRaw:(pr.ovr!=null?pr.ovr:null);

    const lv=live[c[0]]||{};
    out.push({id:"D"+i,name:c[0],stadium,placed:!!stadium,
      rank,wr,games,wins,gamesKnown:gKnown,known:!!(rank||wr!=null),
      adj:((cfg&&cfg.adj)||{})[c[0]]||0,
      rz:rankZ(rank,games,cfg),wz:winZ(games,wins),
      ovr,revealed:ovr!=null,ovrFromDb:!ovrOk&&pr.ovr!=null,
      defWin:lv.def||0, taken:Math.min(3,lv.hit||0), ace, sub});
  });
  return out;
}

/* 공격자 · 수비자 · [승패] · [스코어]
   dir="atk" 우리가 공격 / dir="def" 상대가 공격 */
function parseRecords(text,roster,odb,season,club,cfg,dir){
  odb=odb||{}; cfg=cfg||{}; const rows=[],bad=[];
  const weAttack=dir!=="def";
  text.split(/\r?\n/).forEach((line,li)=>{
    if(!line.trim()||/^#/.test(line))return;
    const raw=cells(line); if(!raw.some(x=>x))return;
    const tags=raw.filter(t=>isRoleTok(t)||isDeckTok(t)||/^미공개$/.test(t));
    const c=raw.filter(t=>tags.indexOf(t)<0);
    if(!c[0]||!c[1]){bad.push(li+1);return;}

    let win=null, rf=null, ra=null;
    const rest=c.slice(2).filter(t=>t!=="");
    rest.forEach(t=>{
      const v=t.trim();
      if(/^(승|W|w|승리)$/.test(v))win=true;
      else if(/^(패|L|l|패배)$/.test(v))win=false;
      else{const m=v.match(/^(\d+)\s*[-:]\s*(\d+)$/); if(m){rf=+m[1];ra=+m[2];}}
    });
    if(rf==null){
      const ns=rest.map(num).filter(v=>v!=null);
      if(ns.length>=2){rf=ns[0];ra=ns[1];}
    }
    /* 스코어만 있으면 승패를 자동으로 정한다 (동점은 공격 실패로 본다) */
    if(win==null&&rf!=null)win=rf>ra;
    if(win==null){bad.push(li+1);return;}

    const aName=c[0], dName=c[1];
    /* 명단에 없는 이름이 와도 크래시 없이 기본값으로 처리한다 */
    const aMine=weAttack?roster.find(x=>x.name===aName):null;
    const dMine=weAttack?null:roster.find(x=>x.name===dName);
    const aOpp=odb[aName]||{};
    const dOpp=odb[dName]||{};
    const og=cfg.oppGames||40;
    const aSub=tags.some(t=>/^(클라|라인업)$/.test(t));

    const aRank=aMine?aMine.rank:(aOpp.rank||0);
    const aGames=aMine?aMine.games:(aOpp.games||og);
    const aWins=aMine?aMine.wins:((aOpp.wr!=null?aOpp.wr:.5)*(aOpp.games||og));
    const aOvr=aMine?(aSub?(cfg.subOvr||0):aMine.ovr):(aOpp.ovr||120);
    const dRank=dMine?dMine.rank:(dOpp.rank||0);
    const dGames=dMine?dMine.games:(dOpp.games||og);
    const dWins=dMine?dMine.wins:((dOpp.wr!=null?dOpp.wr:.5)*(dOpp.games||og));
    const dOvr=dMine?dMine.ovr:(dOpp.ovr||120);

    rows.push({season,club:club||"",dir:weAttack?"atk":"def",
      a:aName,d:dName,win,runsFor:rf,runsAgainst:ra,
      aRank,aGames,aWins,aOvr,dRank,dGames,dWins,dOvr,
      aSub, dSub:tags.some(t=>/^상대클라$/.test(t)),
      blind:tags.some(t=>/^미공개$/.test(t)),
      role:roleOf(tags.filter(isRoleTok))});
  });
  return {rows,bad};
}

/* ── 승률 ── */
function makeProb(cfg){
  return function(a,d){
    let my=a.ovr, their=d.ovrNow;
    if(a.role==="KILLER"){their=d.ovrBase; if(their>my)my+=d.ace?3:2;}
    if(a.role==="OPENER"&&!d.revealed)my+=1;
    let z=cfg.bias+cfg.kOvr*(my-their);
    const sk=a.isSub?.5:1;   /* 클라는 공용 덱이라 개인 랭챌 실력이 덜 반영됨 */
    z+=cfg.kRank*(sk*(a.rz||0)-(d.rz||0))+cfg.kWin*(sk*(a.wz||0)-(d.wz||0));
    z+=sk*(a.adj||0)-(d.adj||0);   /* 사람이 직접 넣은 실력 보정 */
    if(a.isSub)z-=cfg.subPenalty;
    if(d.sub)z+=cfg.subPenalty;
    if(!d.revealed)z-=cfg.blindPenalty;
    return 1/(1+Math.exp(-z));
  };
}
const chipAmt=(role,used)=>role==="KILLER"?0:(role==="OPENER"&&!used)?2:1;

/* ── 학습 ── */
function fitModel(recs,cfg){
  const n=recs.length; if(n<8)return null;
  const F=recs.map(r=>({
    x1:rankZ(r.aRank,r.aGames||0,cfg)-rankZ(r.dRank,r.dGames||0,cfg),
    x2:(r.aOvr-r.dOvr)/10,
    x3:winZ(r.aGames||0,r.aWins||0)-winZ(r.dGames||0,r.dWins||0),
    off:(r.aSub?-cfg.subPenalty:0)+(r.dSub?cfg.subPenalty:0)+(r.blind?-cfg.blindPenalty:0),
    y:r.win?1:0}));
  const prior=[cfg.bias,cfg.kRank,cfg.kOvr*10,cfg.kWin];
  let th=prior.slice(); const lam=4, lr=.4;
  const zOf=(t,f)=>t[0]+t[1]*f.x1+t[2]*f.x2+t[3]*f.x3+f.off;
  for(let it=0;it<3000;it++){
    const g=[0,0,0,0];
    for(const f of F){
      const e=1/(1+Math.exp(-zOf(th,f)))-f.y;
      g[0]+=e; g[1]+=e*f.x1; g[2]+=e*f.x2; g[3]+=e*f.x3;
    }
    for(let i=0;i<4;i++) th[i]-=lr*(g[i]/n+lam/n*(th[i]-prior[i]));
  }
  let ok=0,ll=0;
  for(const f of F){
    const p=1/(1+Math.exp(-zOf(th,f)));
    if((p>=.5?1:0)===f.y)ok++;
    ll+=-(f.y*Math.log(Math.max(1e-9,p))+(1-f.y)*Math.log(Math.max(1e-9,1-p)));
  }
  const wr=F.reduce((t,f)=>t+f.y,0)/n;
  const base=-(wr*Math.log(Math.max(1e-9,wr))+(1-wr)*Math.log(Math.max(1e-9,1-wr)));
  return {n,bias:th[0],kRank:th[1],kOvr:th[2]/10,kWin:th[3],
          acc:ok/n,logloss:ll/n,baseLL:base,winRate:wr};
}

/* ── 랭챌 누적 → 선수 프로필 (최근 시즌 가중) ── */
/* 이름 · 순위 · 승 · 무 · 패   (승-무-패 한 칸, 또는 판수+승률% 도 인식) */
function parseRc(text,season,side,club){
  const rows=[],bad=[];
  text.split(/\r?\n/).forEach((line,li)=>{
    if(!line.trim()||/^#/.test(line))return;
    const c=cells(line); if(!c[0]){bad.push(li+1);return;}
    const rank=num(c[1])||0;
    let rest=c.slice(2).filter(t=>t!=="");
    let pct=null;
    const pi=rest.findIndex(t=>/%/.test(t));
    if(pi>=0){pct=num(rest[pi]); rest=rest.slice(0,pi).concat(rest.slice(pi+1));}
    let w=0,dr=0,l=0;
    const dash=rest.find(t=>/^\d+\s*[-/]\s*\d+\s*[-/]\s*\d+$/.test(t));
    if(dash){ const v=dash.split(/[-/]/).map(x=>parseInt(x,10)); w=v[0];dr=v[1];l=v[2]; }
    else{
      const n2=rest.map(num).filter(v=>v!=null);
      if(n2.length>=3){ w=n2[0]; dr=n2[1]; l=n2[2]; }
      else if(n2.length===2){ w=n2[0]; l=n2[1]; }
      else if(n2.length===1&&pct!=null){ const g=n2[0]; w=Math.round(g*pct/100); l=g-w; }
    }
    const games=w+dr+l;
    if(!rank&&!games){
      /* 이름만 있는 줄은 아직 안 채운 칸이므로 조용히 넘긴다 */
      if(c.length<=1||!c.slice(1).some(x=>x))return;
      bad.push(li+1);return;
    }
    rows.push({season,side,club:club||"",name:c[0],rank,w,d:dr,l,games,wins:w+dr*.5});
  });
  return {rows,bad};
}
function buildRcDb(recs){
  const by={};
  recs.forEach(r=>{(by[r.name]=by[r.name]||[]).push(r);});
  const db={};
  Object.keys(by).forEach(n=>{
    const list=by[n].slice().sort((a,b)=>seasonKey(b.season)-seasonKey(a.season));
    let lr=0,lw=0,gs=0,ws=0;
    list.forEach((r,i)=>{
      const w=Math.pow(.6,i);
      if(r.rank>0){lr+=w*Math.log10(r.rank);lw+=w;}
      gs+=w*(r.games||0); ws+=w*(r.wins||0);
    });
    const cl=list.find(r=>r.club); 
    db[n]={name:n,side:list[0].side,club:cl?cl.club:"",seasons:list.length,hist:list.slice(0,6),
      rank:lw>0?Math.round(Math.pow(10,lr/lw)):0,
      games:Math.round(gs),wins:Math.round(ws),
      wr:gs>0?ws/gs:0};
  });
  return db;
}
function buildDb(recs){
  const db={};
  recs.forEach(r=>{
    const e=db[r.d]||{name:r.d,n:0,lost:0,rank:0,ovr:0,season:""};
    e.n++; if(!r.win)e.lost++;
    e.rank=r.dRank||e.rank; e.ovr=r.dOvr||e.ovr; e.season=r.season||e.season;
    db[r.d]=e;
  });
  return db;
}

/* ── 상대 랭챌 보강: 명단과 따로 들어오는 자료를 닉네임으로 합침 ── */
function parseOppRc(text){
  const rows=[],bad=[];
  text.split(/\r?\n/).forEach((line,li)=>{
    if(!line.trim()||/^#/.test(line))return;
    const c=cells(line); if(!c[0]){bad.push(li+1);return;}
    const rank=num(c[1])||0;
    let rest=c.slice(2).filter(t=>t!=="");
    let pctv=null;
    const pi=rest.findIndex(t=>/%/.test(t));
    if(pi>=0){pctv=num(rest[pi]); rest=rest.slice(0,pi).concat(rest.slice(pi+1));}
    let w=0,dr=0,l=0;
    const dash=rest.find(t=>/^\d+\s*[-\/]\s*\d+\s*[-\/]\s*\d+$/.test(t));
    if(dash){const v=dash.split(/[-\/]/).map(x=>parseInt(x,10));w=v[0];dr=v[1];l=v[2];}
    else{
      const n2=rest.map(num).filter(v=>v!=null);
      if(n2.length>=3){w=n2[0];dr=n2[1];l=n2[2];}
      else if(n2.length===2){w=n2[0];l=n2[1];}
      else if(n2.length===1&&pctv!=null){const g=n2[0];w=Math.round(g*pctv/100);l=g-w;}
    }
    const games=w+dr+l;
    if(!rank&&!games&&pctv==null){
      /* 이름만 있는 줄은 아직 안 채운 칸이므로 조용히 넘긴다 */
      if(c.length<=1||!c.slice(1).some(x=>x))return;
      bad.push(li+1);return;
    }
    rows.push({name:c[0],rank,games,wins:w+dr*.5,
      wr:games>0?(w+dr*.5)/games:(pctv!=null?pctv/100:null),
      gamesKnown:games>0});
  });
  return {rows,bad};
}
function mergeOppRc(odb,rows,club){
  const next=Object.assign({},odb);
  rows.forEach(r=>{
    const prev=next[r.name]||{};
    next[r.name]=Object.assign({},prev,{name:r.name,club:club||prev.club||"",
      rank:r.rank||prev.rank||0,
      wr:r.wr!=null?r.wr:(prev.wr!=null?prev.wr:null),
      games:r.games||prev.games||0,
      gamesKnown:r.gamesKnown||!!prev.gamesKnown});
  });
  return next;
}

/* ── 상대 프로필: 닉네임별 최신 스냅샷 ── */
function upsertOpps(odb,opps,club,season){
  const next=Object.assign({},odb);
  opps.forEach(d=>{
    const prev=next[d.name]||{};
    next[d.name]={name:d.name,club:club||prev.club||"",
      stadium:d.stadium||prev.stadium||null,
      rank:d.rank||prev.rank||0,
      wr:d.wr!=null?d.wr:(prev.wr!=null?prev.wr:null),
      games:(d.gamesKnown?d.games:0)||prev.games||0,
      gamesKnown:d.gamesKnown||!!prev.gamesKnown,
      ovr:d.ovr!=null?d.ovr:(prev.ovr||null),
      ace:d.ace||false, seen:(prev.seen||0)+1, season:season||prev.season||""};
  });
  return next;
}
function oppsToText(odb,club){
  return Object.keys(odb).map(k=>odb[k]).filter(e=>!club||e.club===club)
    .map(e=>[e.name,e.stadium||"NA",e.rank||"",e.wr!=null?e.wr.toFixed(3):"",
      e.gamesKnown?(e.games||""):"",e.ovr||"",e.ace?"에이스":""].join("\t").replace(/\t+$/,"")).join("\n");
}

/* ── 오더 ── */
/* 포아송 이항: 성공 횟수가 m회 이상일 확률 (3회에서 절단) */
function pois(ps){
  let f=[1,0,0,0];
  for(const p of ps){
    const g=[0,0,0,0];
    for(let i=0;i<4;i++){
      if(!f[i])continue;
      g[i]+=f[i]*(1-p);
      g[Math.min(3,i+1)]+=f[i]*p;
    }
    f=g;
  }
  return [Math.max(0,1-f[0]),Math.max(0,1-f[0]-f[1]),Math.max(0,f[3])];
}

function makeCtx(ours,opps,cfg,db){
  const known=opps.filter(d=>d.revealed).map(d=>d.ovr);
  const guess=known.length?known.reduce((a,b)=>a+b,0)/known.length
    :ours.reduce((t,a)=>t+a.ovr,0)/Math.max(1,ours.length);
  const baseOvr=d=>d.ovr!=null?d.ovr:guess;
  const fromDb=d=>!!d.ovrFromDb;
  const schedOf=d=>d.ace?SCHED_A:SCHED_N;
  const live=opps.filter(d=>d.taken<3&&d.placed);
  const used=[]; live.forEach(d=>{if(used.indexOf(d.stadium)<0)used.push(d.stadium);});
  const byStadium={}; used.forEach(s=>byStadium[s]=opps.filter(d=>d.stadium===s));
  const bonusOf=s=>s===cfg.homeStadium?10:5;
  return {baseOvr,fromDb,schedOf,live,used,byStadium,bonusOf};
}

/* 큐가 정해졌을 때 기대 점수 (연쇄 효과는 근사) */
function evalQueues(queues,opps,ctx,S){
  let total=0;
  const capP={};
  ctx.used.forEach(s=>capP[s]=1);
  opps.forEach(d=>{
    const q=queues[d.id]||[];
    const need=3-d.taken;
    const sched=ctx.schedOf(d);
    if(need<=0){ return; }
    const ge=pois(q.map(x=>x.p));
    for(let m=1;m<=need;m++) total+=sched[d.taken+m-1]*ge[m-1];
    if(capP[d.stadium]!==undefined) capP[d.stadium]*=ge[need-1];
  });
  S.forEach(s=>{ if(capP[s]!==undefined) total+=ctx.bonusOf(s)*capP[s]; });
  return {total,capP};
}

/* 점령 목표 S를 정해두고 배정 */
function allocate(ours,opps,cfg,ctx,S){
  const prob=makeProb(cfg);
  const inS=s=>S.indexOf(s)>=0;
  const cumFor=(d,e)=>{
    const cum=d.ace?CUM_A:CUM_N;
    const lim=inS(d.stadium)?3:Math.min(3,d.taken+1);   /* 비점령 구장은 첫 성공까지만 */
    const x=Math.max(0,Math.min(lim,e)); const i=Math.floor(x);
    return i>=3?cum[3]:cum[i]+(cum[i+1]-cum[i])*(x-i);
  };
  const maxOf=d=>(d.ace?12:10);
  const unitsFor=a=>{
    const u=[Object.assign({},a,{isSub:false,label:a.name})];
    if(cfg.subOvr>0&&!a.reserve)u.push(Object.assign({},a,{ovr:cfg.subOvr,isSub:true,label:a.name+" 클라"}));
    return u;
  };
  const E={},drop={},oUsed={},opened={},left={},subBy={};
  opps.forEach(d=>{E[d.id]=d.taken;drop[d.id]=0;oUsed[d.id]=false;opened[d.id]=false;});
  ours.forEach(a=>{left[a.id]=a.atk;subBy[a.id]=0;});
  /* 클라는 3회 공격과 별개로 주어지는 자원이다 */
  const perMax=cfg.subPerPerson||2;
  let subLeft=(cfg.subOvr>0)?(cfg.subPool||6):0;

  const assigns=[];
  const slots=ours.reduce((t,a)=>t+a.atk,0)+subLeft;
  for(let step=0;step<slots;step++){
    let best=null;
    for(const a of ours){
      if(left[a.id]<=0&&(subLeft<=0||subBy[a.id]>=perMax||a.reserve))continue;
      for(const u of unitsFor(a)){
        if(u.isSub){ if(subLeft<=0||subBy[a.id]>=perMax||a.reserve)continue; }
        else if(left[a.id]<=0)continue;
        for(const d of ctx.live){
          if(E[d.id]>=3-1e-9)continue;
          if(!cfg.allowRepeat&&assigns.some(x=>x.aId===a.id&&x.dId===d.id))continue;
          const base=ctx.baseOvr(d);
          const p=prob(u,{ovrBase:base,ovrNow:base-drop[d.id],revealed:d.revealed,
                          ace:d.ace,sub:d.sub,rz:d.rz,wz:d.wz,adj:d.adj});
          const nE=Math.min(3,E[d.id]+p);
          const dPts=cumFor(d,nE)-cumFor(d,E[d.id]);
          if(dPts<=1e-9 && !inS(d.stadium)) continue;   /* 5점만 챙길 상대는 더 안 때림 */
          /* 점령 목표 구장은 완주 보너스를 균등 배분해 얹는다 */
          let dBonus=0;
          if(inS(d.stadium)){
            const ds=ctx.byStadium[d.stadium];
            const room=ds.reduce((t,x)=>t+(3-x.taken),0);
            dBonus=room>0?ctx.bonusOf(d.stadium)*(nE-E[d.id])/room:0;
          }
          const amt=chipAmt(u.role,oUsed[d.id]);
          const chip=(1-p)*amt*cfg.chipW*cfg.kOvr*(maxOf(d)-cumFor(d,E[d.id]));
          const reveal=(!d.revealed&&!opened[d.id])?cfg.revealValue:0;
          const v=dPts+dBonus+chip+reveal;
          if(!best||v>best.v)best={v,a,u,d,p,amt};
        }
      }
    }
    if(!best)break;
    assigns.push({aId:best.a.id,label:best.u.label,isSub:best.u.isSub,
      role:best.a.role,dId:best.d.id,p:best.p});
    if(best.u.isSub){subLeft--;subBy[best.a.id]++;}
    else left[best.a.id]--;
    E[best.d.id]=Math.min(3,E[best.d.id]+best.p);
    drop[best.d.id]=Math.min(20,drop[best.d.id]+(1-best.p)*best.amt);
    opened[best.d.id]=true;
    if(best.u.role==="OPENER")oUsed[best.d.id]=true;
  }
  const queues={};
  assigns.forEach(x=>{(queues[x.dId]=queues[x.dId]||[]).push(x);});
  return {assigns,queues};
}

function buildPlan(ours,opps,cfg,db){
  if(!ours.length)return null;
  const ctx=makeCtx(ours,opps,cfg,db);
  if(!ctx.live.length)return null;
  const prob=makeProb(cfg);

  /* 구장 매력도 = (얻을 점수 + 보너스) / 필요 공격수 */
  const score=ctx.used.map(s=>{
    const ds=ctx.byStadium[s];
    let pts=0,cost=0;
    ds.forEach(d=>{
      const need=3-d.taken; if(need<=0)return;
      const sched=ctx.schedOf(d);
      for(let m=1;m<=need;m++)pts+=sched[d.taken+m-1];
      const base=ctx.baseOvr(d);
      const ps=ours.map(a=>prob(Object.assign({},a,{isSub:false}),
        {ovrBase:base,ovrNow:base,revealed:d.revealed,ace:d.ace,sub:d.sub,rz:d.rz,wz:d.wz,adj:d.adj}))
        .sort((x,y)=>y-x).slice(0,3);
      const pm=ps.length?ps.reduce((t,v)=>t+v,0)/ps.length:0.1;
      cost+=need/Math.max(0.08,pm);
    });
    const bonusPts=ctx.bonusOf(s)*cfg.captureBias;
    /* 어차피 첫 성공 5점은 챙기므로, 점령의 순증분만 본다 */
    const baseline=ds.reduce((t,d)=>t+(d.taken<3?ctx.schedOf(d)[d.taken]:0),0);
    return {s,gain:(pts-baseline+bonusPts)/Math.max(1,cost),cost};
  }).sort((a,b)=>b.gain-a.gain);

  let best=null;
  for(let k=0;k<=score.length;k++){
    const S=score.slice(0,k).map(o=>o.s);
    const al=allocate(ours,opps,cfg,ctx,S);
    const ev=evalQueues(al.queues,opps,ctx,S);
    if(!best||ev.total>best.ev.total)best={S,al,ev,k};
  }

  const {S,al}=best;
  const key=x=>x.role==="OPENER"?-2:x.role==="KILLER"?-1:x.p;
  const queues=al.queues;
  Object.keys(queues).forEach(k=>queues[k].sort((m,n)=>key(m)-key(n)));
  const ordered=[];
  let maxLen=0; Object.keys(queues).forEach(k=>{if(queues[k].length>maxLen)maxLen=queues[k].length;});
  for(let w=0;w<maxLen;w++)
    ctx.live.forEach(d=>{const q=queues[d.id];if(q&&q[w])ordered.push(Object.assign({},q[w],{wave:w+1}));});

  return {assigns:al.assigns,queues,ordered,used:ctx.used,byStadium:ctx.byStadium,
    bonusOf:ctx.bonusOf,schedOf:ctx.schedOf,baseOvr:ctx.baseOvr,fromDb:ctx.fromDb,
    live:ctx.live,S,evScore:best.ev.total};
}

/* ── 시뮬 ── */
function simulate(plan,ours,opps,cfg,N){
  if(!plan)return null; N=N||1200;
  const prob=makeProb(cfg);
  const aMap={},dMap={};
  ours.forEach(a=>aMap[a.id]=a); opps.forEach(d=>dMap[d.id]=d);
  let sum=0,sumSq=0,hit=0;
  const cap={}; plan.used.forEach(s=>cap[s]=0);
  for(let n=0;n<N;n++){
    const s={},drop={},oU={};
    opps.forEach(d=>{s[d.id]=d.taken;drop[d.id]=0;oU[d.id]=false;});
    let score=0;
    for(const st of plan.ordered){
      const a=aMap[st.aId], d=dMap[st.dId];
      if(!a||!d||s[d.id]>=3)continue;
      const base=plan.baseOvr(d);
      const p=prob(Object.assign({},a,{ovr:st.isSub?cfg.subOvr:a.ovr,isSub:st.isSub}),
        {ovrBase:base,ovrNow:base-drop[d.id],revealed:d.revealed,ace:d.ace,sub:d.sub,rz:d.rz,wz:d.wz,adj:d.adj});
      if(Math.random()<p){score+=plan.schedOf(d)[s[d.id]];s[d.id]++;}
      else drop[d.id]=Math.min(20,drop[d.id]+chipAmt(a.role,oU[d.id]));
      if(a.role==="OPENER")oU[d.id]=true;
    }
    plan.used.forEach(st=>{
      if(plan.byStadium[st].every(d=>s[d.id]>=3)){score+=plan.bonusOf(st);cap[st]++;}});
    sum+=score;sumSq+=score*score;
    if(score>=cfg.target)hit++;
  }
  const mean=sum/N, capRate={};
  plan.used.forEach(s=>capRate[s]=cap[s]/N);
  return {mean,sd:Math.sqrt(Math.max(0,sumSq/N-mean*mean)),capRate,hitRate:hit/N};
}

/* ── 닉네임 자동완성 (기록 탭) ── */
function acPool(col,dir){
  const mineFirst=dir!=="def";
  if((col===0)===mineFirst)return D.ours.map(a=>a.name);
  const set={};
  Object.keys(st.oppDb).forEach(n=>set[n]=1);
  st.records.forEach(r=>{if(r.d)set[r.d]=1;});
  D.opps.forEach(d=>set[d.name]=1);
  return Object.keys(set);
}
function acContext(el){
  const pos=el.selectionStart;
  const before=el.value.slice(0,pos);
  const ls=before.lastIndexOf("\n")+1;
  const line=before.slice(ls);
  const seg=line.split(/[\t,]/);
  const tok=seg[seg.length-1];
  return {col:seg.length-1, token:tok, start:ls+line.length-tok.length, pos:pos};
}
function acUpdate(taId){
  taId=taId||"ta-atk";
  const el=document.getElementById(taId), box=document.getElementById("ac-"+taId);
  if(!el||!box)return;
  const dir=taId==="ta-def"?"def":"atk";
  const c=acContext(el), t=(c.token||"").trim();
  if(c.col>1||!t){box.innerHTML="";return;}
  const pool=acPool(c.col,dir);
  const lower=t.toLowerCase();
  let hit=pool.filter(n=>n!==t&&n.toLowerCase().indexOf(lower)===0);
  if(!hit.length)hit=pool.filter(n=>n!==t&&n.toLowerCase().indexOf(lower)>=0);
  box.innerHTML=hit.slice(0,8).map(n=>'<button class="acb" data-n="'+esc(n)+'" data-ta="'+taId+'">'+esc(n)+'</button>').join("");
}
function acInsert(taId,name){
  const el=document.getElementById(taId); if(!el)return;
  const c=acContext(el), v=el.value;
  el.value=v.slice(0,c.start)+name+"\t"+v.slice(c.pos);
  const np=c.start+name.length+1;
  el.selectionStart=el.selectionEnd=np;
  if(taId==="ta-def")st.logDef=el.value; else st.logAtk=el.value;
  el.focus(); acUpdate(taId);
}

async function setAdj(name,delta){

/* ── 백업 ── */
const stamp=t=>{const d=new Date(t);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+
    ":"+String(d.getMinutes()).padStart(2,"0");};
function snapshot(){
  const now=Date.now();
  return {v:5, ts:now, built:stamp(now),
    oursText:st.oursText, cfg:st.cfg, oppClub:st.oppClub,
    rcRecords:st.rcRecords, oppDb:st.oppDb, records:st.records, warResults:st.warResults};
}
function applySnapshot(o){
  if(!o)return false;
  if(o.oursText)st.oursText=o.oursText;
  if(o.cfg)Object.assign(st.cfg,o.cfg);
  if(o.warSeason&&!(o.cfg&&o.cfg.warSeasonNow))st.cfg.warSeasonNow=o.warSeason;
  if(o.oppClub)st.oppClub=o.oppClub;
  if(Array.isArray(o.warResults))st.warResults=o.warResults;
  if(Array.isArray(o.rcRecords))st.rcRecords=o.rcRecords;
  if(o.oppDb&&typeof o.oppDb==="object")st.oppDb=o.oppDb;
  if(Array.isArray(o.records))st.records=o.records;
  return true;
}
/* 지금 자료를 그대로 품은 HTML 파일을 만든다 */
function downloadHtml(){
  try{
    const doc=document.documentElement.cloneNode(true);
    ["#app","#nav"].forEach(sel=>{const n=doc.querySelector(sel);if(n)n.innerHTML="";});
    const hd=doc.querySelector("#hdinfo"); if(hd)hd.textContent="";
    Array.prototype.slice.call(doc.querySelectorAll("script#seed")).forEach(n=>n.parentNode.removeChild(n));
    const seed=document.createElement("script");
    seed.id="seed";
    seed.textContent="window.__SEED__="+JSON.stringify(snapshot()).replace(/</g,"\\u003c")+";";
    doc.querySelector("head").appendChild(seed);
    const blob=new Blob(["<!DOCTYPE html>\n"+doc.outerHTML],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="클럽대전-오더도우미.html";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.parentNode.removeChild(a);},1500);
    flash("자료가 담긴 HTML을 내려받았습니다");
  }catch(e){ flash("내려받기가 막혔습니다 — 아래 백업 글을 대신 쓰세요"); }
}

async function load(){
  /* 1) 브라우저에 저장된 것 */
  let stored=null;
  try{const v=await store.get("clubwar:v5"); if(v)stored=JSON.parse(v);}catch(e){}
  if(!stored) for(const k of LEGACY){
    try{const v=await store.get(k); if(v){stored=JSON.parse(v);break;}}catch(e){}
  }
  if(stored){
    try{const v=await store.get("clubwar:rc"); if(v)stored.rcRecords=JSON.parse(v);}catch(e){}
    try{const v=await store.get("clubwar:opp"); if(v)stored.oppDb=JSON.parse(v);}catch(e){}
    try{const v=await store.get("clubwar:live"); if(v)st.live=JSON.parse(v);}catch(e){}
    try{const v=await store.get("clubwar:log"); if(v)stored.records=JSON.parse(v);}catch(e){}
    try{const v=await store.get("clubwar:war"); if(v)stored.warResults=JSON.parse(v);}catch(e){}
  }
  /* 2) HTML에 구워진 것 */
  const seed=(typeof window!=="undefined"&&window.__SEED__)||null;
  /* 더 최근 것을 쓴다 */
  const useSeed=seed&&(!stored||(seed.ts||0)>=(stored.ts||0));
  if(1){}
  applySnapshot(useSeed?seed:(stored||seed));
  st.seeded=!!useSeed;
  if(ensureIds())await saveLog();
  st.seedTs=seed?(seed.built||stamp(seed.ts||0)):null;
  st.storedTs=stored?(stored.built||(stored.ts?stamp(stored.ts):null)):null;
}

function oppRow(d){

    (d.ace?chip("에이스","violet"):"")+(d.sub?chip("클라","green"):"")+

    (d.rank?chip("#"+d.rank.toLocaleString(),"amber"):chip("순위 없음","red"))+

/* ③ 오더 */
function orderText(){
  if(!D.plan)return"";
  const L=["[클럽대전 오더] "+(st.oppClub||""),""];
  D.plan.used.forEach(s=>{if(D.policy[s])L.push("· "+s+" — "+D.policy[s]);});
  L.push("");
  D.ours.forEach(a=>{
    const q=D.plan.ordered.filter(x=>x.aId===a.id);
    if(!q.length)return;
    const tag=a.role!=="NONE"?"["+ROLE_LABEL[a.role]+"] ":"";
    L.push(tag+a.name+" → "+q.map(x=>D.dMap[x.dId].stadium+" "+D.dMap[x.dId].name+
      (x.isSub?"(클라)":"")+" "+Math.round(x.p*100)+"%").join(" / "));
  });
  L.push("","※ 같은 상대는 번호 순서대로. 앞이 실패해도 상대 OVR이 깎여 뒤가 유리해집니다.");
  return L.join("\n");
}

    }).join("")+'</div>'+
    '<div class="btnrow" style="margin-top:16px">'+btnH("btn-copyorder","오더 복사","cyan")+'<span class="msg"></span></div>'+

       btnH("btn-delsel",nSel?"선택 "+nSel+"건 삭제":"선택 없음",nSel?"red":"dim")+
       btnH("btn-exp","복사","cyan")+'<span class="msg"></span></div>'+
       (shown.length?shown.map(o=>{
         const r=o.r, on=!!st.sel[r.rid];
         return '<div class="row rowsel" data-rid="'+esc(r.rid)+'" style="cursor:pointer;'+
           (on?"background:#1E2A3D":"")+'">'+
           '<span style="width:22px;flex-shrink:0;color:'+(on?"var(--cyan)":"var(--dim)")+
           ';font-family:var(--mono)">'+(on?"☑":"☐")+'</span>'+
           '<span class="nm">'+esc(r.a)+' → '+esc(r.d)+'</span>'+
           chip(r.dir==="def"?"수비":"공격",r.dir==="def"?"violet":"cyan")+
           (st.logFilter==="all"?chip(r.season+" "+(r.club||"-"),"dim"):"")+
           (r.runsFor!=null?chip(r.runsFor+"-"+r.runsAgainst,"dim"):"")+
           chip(r.win?"승":"패",r.win?"green":"red")+'</div>';
       }).join(""):'<div class="note" style="margin:0">해당 기록이 없습니다.</div>')+
       (list.length>80?'<div class="note">최근 80건만 보여줍니다.</div>':"");
   })()+'</div>';
}

/* ── 이벤트 ── */
function on(id,ev,fn){const e=document.getElementById(id);if(e)e.addEventListener(ev,fn);}
function bind(){
  on("ta-ours","input",e=>{st.oursText=e.target.value;});
  on("ta-ours","blur",render);
  on("ta-opps","input",e=>{st.oppsText=e.target.value;});
  on("ta-opps","blur",render);
  ["ta-atk","ta-def"].forEach(id=>{
    on(id,"input",e=>{
      if(id==="ta-def")st.logDef=e.target.value; else st.logAtk=e.target.value;
      acUpdate(id);
    });
    on(id,"click",()=>acUpdate(id));
    on(id,"keyup",()=>acUpdate(id));
    on(id,"blur",()=>{setTimeout(()=>{
      const b=document.getElementById("ac-"+id);
      if(b&&b.dataset.hold==="1"){b.dataset.hold="";return;}
      render();},150);});
    const box=document.getElementById("ac-"+id);
    if(box&&box.addEventListener)box.addEventListener("mousedown",e=>{
      const t=e.target.closest?e.target.closest(".acb"):null; if(!t)return;
      e.preventDefault(); box.dataset.hold="1"; acInsert(id,t.dataset.n);
    });
  });
  on("ta-rc","input",e=>{st.rcText=e.target.value;});
  on("ta-rc","blur",render);
  on("ta-subnote","input",e=>{st.cfg.subNote=e.target.value;});
  on("in-subovr","input",e=>{const v=parseFloat(e.target.value);st.cfg.subOvr=isNaN(v)?0:v;});
  on("in-subovr","blur",render);
  ["in-club","in-club3"].forEach(id=>{
    on(id,"input",e=>{st.oppClub=e.target.value;});
    on(id,"blur",render);
  });
  on("in-rn-from","input",e=>{st.renameFrom=e.target.value;});
  on("in-rn-to","input",e=>{st.renameTo=e.target.value;});
  on("sel-home","change",e=>{st.cfg.homeStadium=e.target.value;render();});
  on("sel-season","change",e=>{st.rcSeasonSel=parseInt(e.target.value,10);render();});
  on("sel-war","change",e=>{st.warSel=parseInt(e.target.value,10);st.editWar=null;render();});
  on("sel-club","change",e=>{
    if(!e.target.value)return;
    st.oppClub=e.target.value;
    st.oppsText=oppsToText(st.oppDb,st.oppClub);
    render(); flash("'"+st.oppClub+"' 명단을 불러왔습니다");
  });
  on("ck-rep","change",e=>{st.cfg.allowRepeat=e.target.checked;});

  on("btn-save","click",saveAll);
  on("btn-save2","click",saveAll);
  on("btn-copyorder","click",()=>copy(orderText(),"복사했습니다"));
  on("btn-exp","click",()=>copy(logExport(),"기록을 복사했습니다"));

  on("btn-oppsave","click",async()=>{
    if(!st.oppClub.trim()){flash("상대 클럽명을 먼저 적어주세요");return;}
    if(!D.opps.length){flash("저장할 명단이 없습니다");return;}
    st.oppDb=upsertOpps(st.oppDb,D.opps,st.oppClub.trim(),st.cfg.warSeasonNow);
    await saveOpp(); await saveAll(); render();
    flash("'"+st.oppClub+"' "+D.opps.length+"명을 저장했습니다");
  });
  on("btn-oppload","click",()=>{
    const t=oppsToText(st.oppDb,st.oppClub);
    if(!t){flash("'"+st.oppClub+"' 저장 자료가 없습니다");return;}
    st.oppsText=t; render(); flash("불러왔습니다 — 구장과 방어성공은 새로 확인하세요");
  });

  on("btn-mode-power","click",()=>{st.sortMode="power";render();});
  on("btn-mode-adj","click",()=>{st.sortMode="adj";render();});
  on("btn-oppadj","click",()=>{st.oppAdj=!st.oppAdj;render();});
  document.querySelectorAll("[data-hitm],[data-hitp],[data-defm],[data-defp]").forEach(b=>{
    b.addEventListener("click",()=>{
      const ds=b.dataset;
      if(ds.hitm)bump(ds.hitm,"hit",-1);
      else if(ds.hitp)bump(ds.hitp,"hit",1);
      else if(ds.defm)bump(ds.defm,"def",-1);
      else if(ds.defp)bump(ds.defp,"def",1);
    });
  });
  on("btn-livereset","click",async()=>{
    if(!confirm("공략·방어 진행 상황을 모두 0으로 되돌릴까요?"))return;
    st.live={}; await saveLive(); render(); flash("진행 상황을 초기화했습니다");
  });
  on("btn-adjreset","click",async()=>{
    if(!confirm("모든 실력 보정을 지울까요?"))return;
    st.cfg.adj={}; await saveAll(); render(); flash("보정을 모두 지웠습니다");
  });
  document.querySelectorAll("[data-adjm],[data-adjp]").forEach(b=>{
    b.addEventListener("click",()=>{
      const n=b.dataset.adjm||b.dataset.adjp;
      setAdj(n,b.dataset.adjp?.1:-.1);
    });
  });
  on("btn-mode-manual","click",()=>{
    st.sortMode="manual";
    if(!(st.cfg.order||[]).length){
      const pw=e=>st.cfg.kRank*rankZ(e.rank,e.games,st.cfg)+st.cfg.kWin*winZ(e.games,e.wins);
      st.cfg.order=Object.keys(D.rc).map(k=>D.rc[k])
        .filter(e=>D.ours.some(a=>a.name===e.name))
        .sort((a,b)=>pw(b)-pw(a)).map(e=>e.name);
    }
    render();
  });
  on("btn-sortreset","click",async()=>{st.cfg.order=[];await saveAll();render();});
  document.querySelectorAll(".mv").forEach(b=>{
    b.addEventListener("click",async()=>{
      const ord=(st.cfg.order||[]).slice();
      const nm=b.dataset.up||b.dataset.dn;
      const i=ord.indexOf(nm); if(i<0)return;
      const j=b.dataset.up?i-1:i+1;
      if(j<0||j>=ord.length)return;
      ord[i]=ord[j]; ord[j]=nm;
      st.cfg.order=ord; await saveAll(); render();
    });
  });
  on("btn-rcfill","click",()=>{
    st.rcText=rcTemplate(st.rcSeasonSel); render(); flash("명단에서 이름을 다시 깔았습니다");
  });
  on("btn-orphan","click",async()=>{
    if(!D.orphans.length)return;
    if(!confirm("명단에 없는 "+D.orphans.length+"명의 랭챌 기록을 지울까요?"))return;
    const n=D.orphans.length;
    st.rcRecords=st.rcRecords.filter(r=>!D.orphans.some(o=>o===r.name));
    await saveRc(); render(); flash(n+"명의 기록을 지웠습니다");
  });
  on("btn-rcadd","click",async()=>{
    if(!D.rcStaged.rows.length){flash("추가할 기록이 없습니다");return;}
    const n=D.rcStaged.rows.length, sea=st.rcSeasonSel;
    st.rcRecords=st.rcRecords.filter(r=>!(r.season===sea&&
      D.rcStaged.rows.some(x=>x.name===r.name)));
    st.rcRecords=st.rcRecords.concat(D.rcStaged.rows);
    st.rcText=""; await saveRc(); render();
    flash(sea+" 시즌 "+n+"명 저장 — 누적 "+st.rcRecords.length+"건");
  });
  on("btn-fit","click",()=>{
    if(!D.fit)return;
    st.cfg.bias=D.fit.bias; st.cfg.kRank=D.fit.kRank;
    st.cfg.kOvr=D.fit.kOvr; st.cfg.kWin=D.fit.kWin;
    render(); flash("학습값을 반영했습니다");
  });
  on("btn-rename","click",async()=>{
    const f=st.renameFrom.trim(), t=st.renameTo.trim();
    if(!f||!t){flash("이전 닉과 새 닉을 모두 적어주세요");return;}
    let n=0;
    st.rcRecords.forEach(r=>{if(r.name===f){r.name=t;n++;}});
    st.records.forEach(r=>{if(r.d===f){r.d=t;n++;} if(r.a===f){r.a=t;n++;}});
    if(st.oppDb[f]){st.oppDb[t]=Object.assign({},st.oppDb[f],{name:t});delete st.oppDb[f];n++;}
    if(!n){flash("'"+f+"' 자료를 찾지 못했습니다");return;}
    st.renameFrom=""; st.renameTo="";
    await saveRc(); await saveLog(); await saveOpp(); render();
    flash(n+"건을 '"+t+"'으로 옮겼습니다");
  });
  document.querySelectorAll("[data-war]").forEach(b=>{
    b.addEventListener("click",()=>{
      const i=parseInt(b.dataset.war,10);
      const r=st.warResults[i]; if(!r)return;
      if(st.editWar===i){st.editWar=null;st.scoreUs="";st.scoreThem="";render();return;}
      st.editWar=i; st.warSel=r.season; st.oppClub=r.club||"";
      st.scoreUs=String(r.us); st.scoreThem=String(r.them);
      render();
    });
  });
  on("btn-warcancel","click",()=>{st.editWar=null;st.scoreUs="";st.scoreThem="";render();});
  on("btn-wardel","click",async()=>{
    const i=st.editWar; const r=st.warResults[i]; if(!r)return;
    const match=x=>x.season===r.season&&(x.club||"")===(r.club||"");
    const n=st.records.filter(match).length;
    const label=r.season+"시즌 "+(r.club||"?")+" "+r.us+":"+r.them;
    if(!confirm(n?label+" 최종 점수와 대전 기록 "+n+"건을 함께 지울까요?":label+" 을 지울까요?"))return;
    st.warResults=st.warResults.filter((x,k)=>k!==i);
    if(n)st.records=st.records.filter(x=>!match(x));
    st.editWar=null; st.scoreUs=""; st.scoreThem="";
    await saveWar(); if(n)await saveLog();
    render(); flash(n?"최종 점수와 기록 "+n+"건을 지웠습니다":"최종 점수를 지웠습니다");
  });
  on("in-su","input",e=>{st.scoreUs=e.target.value;});
  on("in-st","input",e=>{st.scoreThem=e.target.value;});
  on("btn-saveall","click",async()=>{
    const u=parseInt(st.scoreUs,10), t=parseInt(st.scoreThem,10);
    const rows=D.stAtk.rows.concat(D.stDef.rows);
    const hasScore=!isNaN(u)&&!isNaN(t);
    if(!hasScore&&!rows.length){flash("저장할 내용이 없습니다");return;}
    const msg=[];
    if(hasScore){
      const rec={season:st.warSel,club:st.oppClub,us:u,them:t,ts:Date.now()};
      if(st.editWar!=null&&st.warResults[st.editWar]) st.warResults[st.editWar]=rec;
      else{
        st.warResults=st.warResults.filter(r=>!(r.season===st.warSel&&r.club===st.oppClub));
        st.warResults.push(rec);
      }
      st.editWar=null; st.scoreUs=""; st.scoreThem="";
      await saveWar();
      msg.push(u>t?"승리":u<t?"패배":"무승부");
    }
    if(rows.length){
      rows.forEach(r=>{r.rid=uid();});
      st.records=st.records.concat(rows);
      st.logAtk=""; st.logDef="";
      await saveLog();
      msg.push(rows.length+"건");
    }
    render(); flash(st.warSel+"시즌 "+msg.join(" · ")+" 저장 — 누적 "+st.records.length+"건");
  });
  const filMatch=r=>{
    if(st.logFilter==="all")return true;
    if(st.logFilter==="cur")return r.season===st.warSel&&(r.club||"")===st.oppClub;
    return (r.season+"|"+(r.club||""))===st.logFilter;
  };
  document.querySelectorAll("[data-fil]").forEach(b=>{
    b.addEventListener("click",()=>{st.logFilter=b.dataset.fil;render();});
  });
  on("btn-selinv","click",()=>{
    const m={};
    st.records.filter(filMatch).forEach(r=>{if(!st.sel[r.rid])m[r.rid]=true;});
    st.sel=m; render();
  });
  document.querySelectorAll(".rowsel").forEach(el=>{
    el.addEventListener("click",()=>{
      const id=el.dataset.rid;
      const m=Object.assign({},st.sel);
      if(m[id])delete m[id]; else m[id]=true;
      st.sel=m; render();
    });
  });
  on("btn-selall","click",()=>{
    const list=st.records.filter(filMatch).slice(-80);
    const allOn=list.length>0&&list.every(r=>st.sel[r.rid]);
    const m=Object.assign({},st.sel);
    list.forEach(r=>{if(allOn)delete m[r.rid]; else m[r.rid]=true;});
    st.sel=m; render();
  });
  on("btn-delsel","click",async()=>{
    const ids=Object.keys(st.sel).filter(k=>st.sel[k]);
    if(!ids.length){flash("선택된 기록이 없습니다");return;}
    if(!confirm("선택한 "+ids.length+"건을 지울까요?"))return;
    st.records=st.records.filter(r=>ids.indexOf(r.rid)<0);
    st.sel={}; await saveLog(); render(); flash(ids.length+"건 지웠습니다");
  });
  on("btn-dlhtml","click",downloadHtml);
  on("btn-reload","click",()=>{
    try{ location.replace(location.pathname+"?v="+Date.now()); }
    catch(e){ flash("새로고침에 실패했습니다"); }
  });
  on("btn-bkcopy","click",()=>copy(JSON.stringify(snapshot()),"백업 글을 복사했습니다"));
  on("btn-restore","click",async()=>{
    const el=document.getElementById("ta-restore");
    const t=el?el.value.trim():"";
    if(!t){flash("백업 글을 먼저 붙여넣으세요");return;}
    let o=null;
    try{o=JSON.parse(t);}catch(e){flash("백업 글을 읽지 못했습니다");return;}
    if(!applySnapshot(o)){flash("백업 글에 자료가 없습니다");return;}
    await saveRc(); await saveOpp(); await saveLog(); await saveAll();
    render(); flash("백업에서 되돌렸습니다");
  });
  const wipe=(label,fn)=>async()=>{
    if(!confirm(label+"를 모두 지울까요? 되돌릴 수 없습니다."))return;
    await fn(); render(); flash(label+"를 지웠습니다");
  };
  on("btn-clr-rc","click",wipe("랭챌 기록",async()=>{st.rcRecords=[];await saveRc();}));
  on("btn-clr-opp","click",wipe("상대 자료",async()=>{st.oppDb={};await saveOpp();}));
  on("btn-clr-log","click",wipe("대전 기록",async()=>{st.records=[];await saveLog();}));

  const S=[["s-target","target",v=>v+"점"],
    ["s-anchor","anchorSeason",v=>v+" 시즌"],
    ["s-krank","kRank",v=>"순위 5배차 → "+pct(v*Math.log10(5))],
    ["s-kwin","kWin",v=>"승률 60% vs 50% → "+pct(v*(winZ(50,30)-winZ(50,25)))],
    ["s-kgames","kGames",v=>v===0?"보정 없음":"20판이면 순위 "+Math.round(Math.pow(10,v*Math.log10(5)))+"배 후하게"],
    ["s-oppgames","oppGames",v=>v+"판으로 간주"],
    ["s-kovr","kOvr",v=>"OVR +5 → "+pct(v*5)],
    ["s-bias","bias",v=>"동급끼리 "+pct(v)],
    ["s-sub","subPenalty",v=>v.toFixed(1)],
    ["s-subpool","subPool",v=>v+"회"],
    ["s-subper","subPerPerson",v=>v+"회"],
    ["s-blind","blindPenalty",v=>v.toFixed(2)],
    ["s-chip","chipW",v=>v.toFixed(2)],
    ["s-reveal","revealValue",v=>v.toFixed(2)],
    ["s-cap","captureBias",v=>v>=1.6?"점령 최우선":v>=.6?"균형":"5점 위주"]];
  S.forEach(function(o){
    on(o[0],"input",e=>{
      const v=parseFloat(e.target.value);
      st.cfg[o[1]]=v;
      if(o[1]==="anchorSeason")st.cfg.anchorDate=isoDay(rcSeason(st.cfg).start);
      const l=document.getElementById("lbl-"+o[0]); if(l)l.textContent=o[2](v);
    });
  });
}
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  st.tab=parseInt(b.dataset.t,10); render(); window.scrollTo(0,0);
});
(async()=>{ await load(); render(); })();

</script>
</body>
</html>
